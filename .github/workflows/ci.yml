name: ci

# Two triggers, and we overlap them on purpose so that you see it happen.
# A push to a branch that already has an open pull request fires both, so the
# Checks tab shows the same job twice. Nothing is wrong. Delete the push
# trigger and a commit you push before opening the PR runs nothing at all.
on: [push, pull_request]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # No `cache: pip` here, and that is deliberate. When this template
          # pinned three packages we ran it three times: 20 s with an empty
          # cache, 18 s with a populated one, 16 s with the line gone. Add it
          # back the day requirements.txt grows a package that compiles from
          # source, and measure it again.

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests tools

      # coverage runs the same pytest and records which lines and branches
      # the tests executed. Executed is not the same as tested: mutmut
      # measures that, and we run it locally because it reruns the suite once
      # per mutant.
      - name: Test
        run: coverage run -m pytest -q

      - name: CRAP gate
        run: |
          coverage json -q
          python tools/crap.py --max 12
