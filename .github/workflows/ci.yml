name: ci

# Two triggers, and we overlap them on purpose so that you see it happen.
# A push to a branch that already has an open pull request fires both, so the
# Checks tab shows the same job twice. Nothing is wrong. Delete the push
# trigger and a commit you push before opening the PR runs nothing at all.
on: [push, pull_request]

# The job's token can read the repository and do nothing else. A step that
# needs more asks for it by name, so a compromised step cannot push code.
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      # Each action is pinned to a full commit SHA, with its version in the
      # comment. A tag such as v7 can be moved by its publisher, and a commit
      # SHA cannot, so the code this step runs changes only when we change it.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          # No `cache: pip` here, and that is deliberate. When this template
          # pinned three packages we ran it three times: 20 s with an empty
          # cache, 18 s with a populated one, 16 s with the line gone. The list
          # has grown since, and two packages now arrive as source archives
          # that pip builds on the runner, so measure it again before you add
          # the line back.

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests tools

      # coverage runs the same pytest and records which lines and branches
      # the tests executed. Executed is not the same as tested: mutmut
      # measures that, and we run it locally because it reruns the suite once
      # per mutant.
      - name: Test
        run: coverage run -m pytest -q

      - name: CRAP gate
        run: |
          coverage json -q
          python tools/crap.py --max 12
