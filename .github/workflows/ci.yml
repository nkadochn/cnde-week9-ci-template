name: ci

# Two triggers, and we overlap them on purpose so that you see it happen.
# A push to a branch that already has an open pull request fires both, so the
# Checks tab shows the same job twice. Nothing is wrong. Delete the push
# trigger and a commit you push before opening the PR runs nothing at all.
on: [push, pull_request]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # No `cache: pip` here, and that is deliberate. We ran this
          # pipeline three times: 20 s with an empty cache, 18 s with a
          # populated one, 16 s with the line gone. Three prebuilt wheels
          # are dominated by installing, not downloading, so there was
          # nothing for a cache to save and it cost a few seconds of its
          # own. Add it back the day requirements.txt grows a package
          # that compiles from source, and measure it again.

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q
