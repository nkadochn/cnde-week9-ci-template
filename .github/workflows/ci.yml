name: ci

# Two triggers, and we overlap them on purpose so that you see it happen.
# A push to a branch that already has an open pull request fires both, so the
# Checks tab shows the same job twice. Nothing is wrong. Delete the push
# trigger and a commit you push before opening the PR runs nothing at all.
on: [push, pull_request]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # No `cache: pip` here, and that is deliberate. We measured it on this
          # repository twice: 10 s to install with an empty cache and 11 s with a
          # populated one. Three prebuilt wheels are dominated by installing, not
          # downloading, so there was nothing for a cache to save. Add it back the
          # day requirements.txt grows a package that compiles from source.

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q
